<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HEADCOUNT</title>
    <meta name="description" content="A satirical 1990s office simulator. Beige, fluorescent, slightly broken." />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #2b2b28;
        overflow: hidden;
        font-family: "MS Sans Serif", "Tahoma", "Geneva", sans-serif;
        color: #e8e0c0;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #boot-note {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        letter-spacing: 0.08em;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-note">LOADING PERSONNEL RECORD&hellip;</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
